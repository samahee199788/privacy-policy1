<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FridgeChef browser smoke tests</title>
  <style>
    body { margin: 2rem; font: 16px system-ui, sans-serif; color: #24352c; }
    #result { padding: 1rem; border-radius: .75rem; background: #eff4e6; }
    iframe { position: absolute; width: 1px; height: 1px; border: 0; }
  </style>
</head>
<body>
  <h1>FridgeChef smoke tests</h1>
  <p id="result" role="status" aria-live="polite">Running…</p>
  <iframe id="app" title="FridgeChef test app"></iframe>
  <script>
    const result = document.getElementById("result");
    const frame = document.getElementById("app");
    const tests = [];
    const LOAD_TIMEOUT_MS = 10000;
    let loadTimeout;
    function waitForFrameLoad(callback, description) {
      clearTimeout(loadTimeout);
      loadTimeout = setTimeout(() => fail(new Error(`Timed out while ${description}.`)), LOAD_TIMEOUT_MS);
      frame.addEventListener("load", () => {
        clearTimeout(loadTimeout);
        callback();
      }, { once: true });
    }
    function assert(condition, message) {
      if (!condition) throw new Error(message);
      tests.push(message);
    }
    function appDocument() { return frame.contentDocument; }
    function clearAppStorage() {
      try {
        const storageKey = appDocument()?.documentElement.dataset.storageKey;
        if (storageKey) frame.contentWindow.localStorage.removeItem(storageKey);
      } catch { }
    }
    function waitForCondition(condition, description, timeoutMs = 2000) {
      return new Promise((resolve, reject) => {
        const deadline = Date.now() + timeoutMs;
        const check = () => {
          try {
            if (condition()) return resolve();
            if (Date.now() >= deadline) return reject(new Error(`Timed out waiting for ${description}.`));
            setTimeout(check, 20);
          } catch (error) { reject(error); }
        };
        check();
      });
    }
    function addPantry(name) {
      const doc = appDocument();
      doc.getElementById("ingredient-input").value = name;
      doc.getElementById("ingredient-form").dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
    }
    function recipe(id) { return appDocument().querySelector(`[data-recipe-id="${id}"]`); }
    function pressKey(target, key) {
      const tab = target.matches('[role="tab"]') ? target : target.closest('[role="tab"]');
      tab?.focus();
      target.dispatchEvent(new KeyboardEvent("keydown", { key, bubbles: true }));
    }
    function finish() {
      clearTimeout(loadTimeout);
      clearAppStorage();
      result.textContent = `PASS — ${tests.length} browser checks`;
    }
    function fail(error) {
      clearTimeout(loadTimeout);
      clearAppStorage();
      result.textContent = `FAIL — ${error.message}`;
      result.style.background = "#f8e5e2";
    }
    function seedCorruptStorage() {
      try {
        const storageKey = appDocument().documentElement.dataset.storageKey;
        if (!storageKey) throw new Error("App storage key is missing.");
        frame.contentWindow.localStorage.setItem(storageKey, "{invalid json");
        waitForFrameLoad(checkCorruptStorageFallback, "reloading with corrupted storage");
        frame.contentWindow.location.reload();
      } catch (error) { fail(error); }
    }
    function checkCorruptStorageFallback() {
      try {
        const doc = appDocument();
        assert(doc.querySelectorAll(".chip").length === 0, "corrupted storage falls back to an empty pantry");
        assert(doc.querySelectorAll(".recipe-card").length > 0, "corrupted storage still loads the app");
        frame.contentWindow.localStorage.removeItem(doc.documentElement.dataset.storageKey);
        waitForFrameLoad(runTests, "reloading with clean storage");
        frame.contentWindow.location.reload();
      } catch (error) { fail(error); }
    }
    waitForFrameLoad(seedCorruptStorage, "loading the app");
    frame.src = "../index.html";
    function testPanelRelationships(doc) {
      assert(doc.getElementById("tab-saved").getAttribute("aria-controls") === "saved-view", "saved tab references its recipe panel");
      assert(doc.getElementById("saved-view").getAttribute("aria-labelledby") === "tab-saved", "saved panel references its tab");
      assert(doc.getElementById("tab-shopping").getAttribute("aria-controls") === "shopping-view", "shopping tab references its panel");
    }
    function testPantryAndRecipes(doc) {
      addPantry("tomato");
      addPantry("tomatoes");
      assert(doc.querySelectorAll(".chip").length === 1, "singular/plural duplicate prevention");
      assert(recipe("tomato-pasta").querySelector(".match").textContent.includes("1 of 4"), "singular tomato matches recipe");
      addPantry("radishes");
      addPantry("radish");
      addPantry("mangoes");
      addPantry("mango");
      assert(doc.querySelectorAll(".chip").length === 3, "shes and oes ingredient plurals normalize");
      doc.getElementById("load-sample").click();
      assert(doc.querySelectorAll(".chip").length === 8, "sample ingredients avoid aliases already in pantry");
      addPantry("onions");
      assert(recipe("garden-omelette").querySelector(".match").textContent.includes("4 of 4"), "plural onion matches recipe");
      const omelette = recipe("garden-omelette");
      omelette.querySelector("[data-cook]").click();
      assert(omelette.querySelector("details").open && doc.activeElement.matches("summary"), "start cooking opens and focuses recipe steps");
      addPantry("black bean");
      assert(recipe("bean-tacos").querySelector(".match").textContent.includes("2 of 4"), "black bean matches black beans");
      const blackBeanChip = [...doc.querySelectorAll(".chip")].find(chip => chip.textContent.includes("black bean"));
      blackBeanChip.querySelector("button").click();
      assert(doc.activeElement.matches("[data-remove-pantry]"), "pantry removal preserves keyboard focus");
      addPantry("black bean");
    }
    function testFavoritesAndShopping(doc) {
      const pasta = recipe("tomato-pasta");
      pasta.querySelector("details summary").click();
      pasta.querySelector("[data-favorite]").click();
      assert(recipe("tomato-pasta").querySelector("details").open, "recipe instructions remain open after favorite action");
      assert(doc.activeElement.matches("[data-favorite]"), "keyboard focus remains on updated favorite");
      recipe("tomato-pasta").querySelector("[data-add-missing]").click();
      assert(doc.activeElement.matches("h3"), "keyboard focus moves to recipe title after shopping action is complete");
      assert(recipe("tomato-pasta").querySelector("[data-add-missing]").disabled, "already-listed missing ingredients are not added twice");
      doc.getElementById("tab-shopping").click();
      assert(doc.getElementById("shopping-list").textContent.includes("olive oil"), "recipe missing ingredient added to shopping list");
      const shoppingInput = doc.getElementById("shopping-input");
      for (const name of ["tomato", "tomatoes"]) {
        shoppingInput.value = name;
        doc.getElementById("shopping-form").dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
      }
      assert(doc.querySelectorAll(".shopping-item").length === 2, "shopping list deduplicates ingredient aliases");
      shoppingInput.value = "milk";
      doc.getElementById("shopping-form").dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
      const milkItem = [...doc.querySelectorAll(".shopping-item")].find(item => item.textContent.toLocaleLowerCase().includes("milk"));
      milkItem.querySelector("[data-remove-shopping]").click();
      assert(doc.querySelectorAll(".shopping-item").length === 2, "shopping item can be removed");
      assert(doc.activeElement.matches("[data-remove-shopping]"), "shopping removal preserves keyboard focus");
      const checkbox = doc.querySelector("[data-check]");
      checkbox.click();
      assert(checkbox.closest(".shopping-item").classList.contains("checked"), "shopping check state updates");
      doc.getElementById("clear-checked").click();
    }
    function testPersistence(doc) {
      assert(doc.querySelectorAll(".chip").length === 10, "pantry persists after reload");
      assert(doc.querySelectorAll(".shopping-item").length === 1, "shopping list persists after reload");
    }
    async function testSearchAndTabs(doc) {
      doc.getElementById("recipe-search").value = "no matching recipe";
      doc.getElementById("recipe-search").dispatchEvent(new Event("input", { bubbles: true }));
      await waitForCondition(() => doc.querySelector(".empty-state strong")?.textContent === "No recipes found.", "no-results state");
      assert(doc.querySelector(".empty-state strong").textContent === "No recipes found.", "empty search shows a no-results message");
      assert(doc.getElementById("recipe-results-status").textContent === "0 recipes found.", "live status reports result count");
      doc.getElementById("tab-saved").click();
      assert(doc.getElementById("recipe-search").value === "" && doc.getElementById("saved-search").value === "", "tab change clears stale searches");
      assert(doc.querySelectorAll(".recipe-card").length === 1, "saved recipe appears after reload");
      const tabs = [...doc.querySelectorAll('[role="tab"]')];
      tabs[1].click();
      pressKey(tabs[1], "ArrowRight");
      assert(doc.activeElement === tabs[2], "arrow key moves focus between tabs");
      assert(tabs[1].getAttribute("aria-selected") === "true", "arrow key does not activate a tab");
      pressKey(tabs[1].querySelector("span"), "Home");
      assert(doc.activeElement === tabs[0], "keyboard navigation works from nested tab content");
      pressKey(tabs[1], "End");
      assert(doc.activeElement === tabs[2], "End key moves focus to the last tab");
      pressKey(tabs[1], "Home");
      assert(doc.activeElement === tabs[0], "Home key moves focus to the first tab");
      pressKey(tabs[0], "ArrowRight");
      assert(doc.activeElement === tabs[1], "ArrowRight moves focus from the first tab");
      assert(tabs[1].getAttribute("aria-selected") === "true", "arrow navigation keeps the selected tab unchanged");
      pressKey(tabs[0], "ArrowLeft");
      assert(doc.activeElement === tabs[2], "ArrowLeft wraps from the first to last tab");
      pressKey(tabs[2], "ArrowRight");
      assert(doc.activeElement === tabs[0], "ArrowRight wraps from the last to first tab");
      doc.getElementById("saved-search").value = "onion";
      pressKey(tabs[2], "ArrowLeft");
      assert(doc.getElementById("saved-search").value === "onion", "arrow navigation preserves the search");
      tabs[1].click();
      pressKey(tabs[1], "ArrowRight");
      tabs[2].click();
      assert(tabs[2].getAttribute("aria-selected") === "true", "click activates the focused tab");
      assert(tabs[2].getAttribute("aria-controls") === "shopping-view", "shopping tab keeps its panel relationship");
      assert(tabs[1].getAttribute("aria-controls") === "saved-view", "saved tab keeps its panel relationship");
    }
    function runTests() {
      try {
        const doc = appDocument();
        testPanelRelationships(doc);
        testPantryAndRecipes(doc);
        testFavoritesAndShopping(doc);
        waitForFrameLoad(() => {
          try {
            const reloaded = appDocument();
            testPersistence(reloaded);
            testSearchAndTabs(reloaded).then(finish).catch(fail);
          } catch (error) { fail(error); }
        }, "checking saved state after reload");
        frame.contentWindow.location.reload();
      } catch (error) { fail(error); }
    }
  </script>
</body>
</html>
